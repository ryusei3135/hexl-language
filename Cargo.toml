[package]
name = "hexl"
version = "1.2.6"
edition = "2024"

# 既存のLSPバイナリ
[[bin]]
name = "hexl_lsp"
path = "src/hexl_lsp/src/main.rs"

# 追加するメインバイナリ
[[bin]]
name = "hexl"
path = "src/main.rs"   # または "src/hexl_cli/main.rs" など自由なパス

[build-dependencies]
cc = "1"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
regex = "1.0"
self_update = { version = "0.41", default-features = false, features = ["archive-tar", "archive-zip", "signatures", "rustls"] }
clap = { version = "4.5", features = ["derive"] }
