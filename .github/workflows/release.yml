name: Release

on:
  push:
    tags:
      - 'v*' # v1.0.0 などのタグがプッシュされた時だけ実行

jobs:
  build-and-release:
    name: Build and Release for ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          # Linux (x86_64)
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: hexl
            asset_name: hexl-x86_64-unknown-linux-gnu.tar.gz
          # macOS (Apple Silicon / Intel 両対応)
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: hexl
            asset_name: hexl-x86_64-apple-darwin.tar.gz
          # Windows (x86_64)
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: hexl.exe
            asset_name: hexl-x86_64-pc-windows-msvc.zip

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package archive (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          # 一時フォルダを作成して必要なものを集める
          mkdir hexl_dist
          cp target/${{ matrix.target }}/release/${{ matrix.artifact_name }} hexl_dist/
          cp -r library hexl_dist/
          cp -r asm_fmts hexl_dist/
          
          # フォルダ内をフラットに圧縮
          tar -czf ${{ matrix.asset_name }} -C hexl_dist .

      - name: Package archive (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          # 一時フォルダを作成して必要なものを集める
          mkdir hexl_dist
          cp target/${{ matrix.target }}/release/${{ matrix.artifact_name }} hexl_dist/
          xcopy /E /I library hexl_dist\library
          xcopy /E /I asm_fmts hexl_dist\asm_fmt
          
          # フォルダ内をフラットに圧縮
          cd hexl_dist
          7z a ../${{ matrix.asset_name }} *

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
